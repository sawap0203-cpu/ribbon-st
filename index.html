

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5e6eb">
<title>Ribbon ♡</title>
<style>
body {
  margin: 0;
  padding: 30px 20px;
  background: #fbf5f7;
  color: #805367;
  font-family: sans-serif;
}
.card {
  background: white;
  border: 1px solid #efd9e2;
  border-radius: 24px;
  padding: 24px;
  text-align: center;
}
button {
  background: #c77f98;
  color: white;
  border: 0;
  border-radius: 14px;
  padding: 12px 20px;
  font-size: 16px;
}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:40px">🎀</div>
  <h1>Ribbon ♡</h1>
  <p>わたしだけの毎日ノート</p>
  <p id="message">今日も一歩ずつ進もう！</p>
  <button onclick="document.getElementById('message').textContent='今日もがんばったね！♡'">
    タップしてね ♡
  </button>
</div>
</body>
</html>
